<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  background: transparent !important;
  background-color: transparent !important;
  font-family: Arial, Helvetica, sans-serif;
  padding: 0;
  margin: 0;
  overflow: hidden;
}

/* TITLE */
.panel-title {
  font-weight: 600;
  text-align: center;
  margin-bottom: 10px;
  color: #ffffff;
  font-size: 18px;
}

/* BLUE DOT */
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  background: #4da3ff;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(0,140,255,0.8);
}

/* MEMBER CARD */
.card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px;
  margin-bottom: 8px;
  border-radius: 10px;
  background: transparent !important;
  transition: background 0.15s ease, transform 0.15s ease;
}

.card:hover {
  background: rgba(0,140,255,0.25) !important;
  transform: scale(1.02);
}

/* AVATAR */
.avatar-ring {
  width: 44px;
  height: 44px;
  padding: 2px;
  border-radius: 50%;
  background: #4da3ff;
  box-shadow: 0 0 12px rgba(0,140,255,0.45);
  flex-shrink: 0;
}

.avatar-ring img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

/* MEMBER INFO */
.card-info {
  flex: 1;
  min-width: 0;
}

.name {
  color: #ecf0f1;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub {
  color: #8fb3cc;
  font-size: 11px;
  margin-top: 2px;
}

/* TIME */
.time {
  color: #6aacda;
  font-size: 11px;
  white-space: nowrap;
}

/* LOADING */
.skeleton {
  height: 60px;
  border-radius: 12px;
  background: transparent !important;
  margin-bottom: 10px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% {
    opacity: .5;
  }

  50% {
    opacity: 1;
  }
}

/* ERROR */
.error {
  font-size: 12px;
  color: #8fb3cc;
  text-align: center;
}
</style>

</head>

<body>

<div id="root">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<script>

const CLUB = 'chess-on-earth-2';

const API = 'https://api.chess.com/pub';

const COUNT = 4;

const RATING_KEYS = [
  ['chess_blitz','⚡','Blitz'],
  ['chess_rapid','🕐','Rapid'],
  ['chess_bullet','🚀','Bullet']
];

function getBestRating(stats) {

  let best = 0;
  let icon = '♟';
  let label = '';

  for (const [key,ic,lbl] of RATING_KEYS) {

    const val =
      stats?.[key]?.last?.rating ||
      stats?.[key]?.best?.rating ||
      0;

    if (val > best) {
      best = val;
      icon = ic;
      label = lbl;
    }
  }

  return best
    ? { value: best, icon, label }
    : null;
}

function timeAgo(ts) {

  const now = Math.floor(Date.now() / 1000);
  const s = now - ts;

  if (s < 60) return s + 's ago';

  const m = Math.floor(s / 60);

  if (m < 60) return m + 'm ago';

  const h = Math.floor(m / 60);

  if (h < 24) return h + 'h ago';

  const d = Math.floor(h / 24);

  return d + 'd ago';
}

async function load() {

  const root = document.getElementById('root');

  try {

    const res =
      await fetch(`${API}/club/${CLUB}/members`);

    const data =
      await res.json();

    const all = [
      ...(data.weekly || []),
      ...(data.monthly || []),
      ...(data.all_time || [])
    ];

    const seen = new Set();

    const unique = all.filter(m => {

      if (seen.has(m.username))
        return false;

      seen.add(m.username);

      return true;

    });

    unique.sort(
      (a,b) =>
        (b.joined || 0) -
        (a.joined || 0)
    );

    const newest =
      unique.slice(0, COUNT);

    const details =
      await Promise.all(

        newest.map(async m => {

          try {

            const [pRes,sRes] =
              await Promise.all([

                fetch(
                  `${API}/player/${m.username}`
                ),

                fetch(
                  `${API}/player/${m.username}/stats`
                )

              ]);

            return {
              username: m.username,
              profile: await pRes.json(),
              stats: await sRes.json(),
              joined: m.joined
            };

          } catch {

            return {
              username: m.username,
              profile: {},
              stats: {},
              joined: m.joined
            };

          }

        })

      );

    root.innerHTML = `

      <div>

        <div class="panel-title">
          <span class="dot"></span>
          New Members 🌎
        </div>

        ${details.map(
          ({username,profile,stats,joined}) => {

            const avatar =
              profile.avatar ||
              'https://www.chess.com/bundles/web/images/noavatar_l.84a92436@2x.gif';

            const rating =
              getBestRating(stats);

            return `

              <div class="card">

                <div class="avatar-ring">

                  <img
                    src="${avatar}"
                    alt="${username}"
                  >

                </div>

                <div class="card-info">

                  <div class="name">
                    @${username}
                  </div>

                  <div class="sub">

                    ${
                      rating
                      ? `${rating.icon} ${rating.value} (${rating.label})`
                      : 'Unrated'
                    }

                  </div>

                </div>

                <div class="time">
                  ${timeAgo(joined)}
                </div>

              </div>

            `;

          }
        ).join('')}

      </div>

    `;

  } catch(e) {

    root.innerHTML = `

      <div class="error">
        Failed to load data
      </div>

    `;

  }

}

load();

setInterval(load, 30000);

</script>

</body>
</html>
